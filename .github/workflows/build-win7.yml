name: Build Windows 7 EXE (32-bit and 64-bit)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            bits: "32"
          - arch: x64
            bits: "64"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: python -m pip install -r requirements-win7.txt

      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Azan-Goo-win${{ matrix.bits }}" --icon "assets/icon.ico" --add-data "assets;assets" --collect-submodules jdatetime main.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Azan-Goo-win${{ matrix.bits }}
          path: dist/Azan-Goo-win${{ matrix.bits }}.exe
